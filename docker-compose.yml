version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: song_db
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=songdb
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: song_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/songdb
    depends_on:
      - mongodb

volumes:
  mongo_data:
